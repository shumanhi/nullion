name: PR Suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shards:
    name: Tests shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NULLION_RUN_E2E: "0"
      COVERAGE_FILE: .coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install app and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run unit shard with coverage
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python scripts/run_test_shard.py --shard "$SHARD" --total 8
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  tests-and-coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest
    needs: test-shards
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install coverage
      - name: Require passing shards
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARDS_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage
        env:
          COVERAGE_FILE: .coverage
        run: |
          python -m coverage combine coverage-data
          python -m coverage report --fail-under=70

  docker-e2e:
    name: Docker e2e suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker E2E suite
        run: ./scripts/e2e-docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: .e2e-artifacts
          if-no-files-found: ignore

  linux-installer:
    name: Linux installer Docker
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run Linux installer smoke
        env:
          NULLION_INSTALLER_SMOKE_TIMEOUT: 45m
        run: ./scripts/installer-docker-linux.sh

  windows-installer:
    name: Windows installer Docker
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows installer smoke
        shell: pwsh
        run: .\scripts\installer-docker-windows.ps1

  macos-installer:
    name: macOS installer
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run macOS installer smoke
        env:
          NULLION_INSTALLER_SMOKE_TIMEOUT_SECONDS: "2700"
        run: ./scripts/installer-macos.sh
